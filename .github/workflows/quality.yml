name: Public repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check public content, metadata, JSON, and links
        run: python scripts/check_public_repo.py
      - name: Validate MCP compatibility lock
        run: python scripts/check_mcp_compatibility.py
